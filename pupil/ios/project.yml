name: Umtomi
options:
  bundleIdPrefix: xyz.sabok
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Umtomi
    MARKETING_VERSION: 5.3.24
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  Umtomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Umtomi
    info:
      path: Umtomi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.sabok.umtomi
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - UmtomiTests
  UmtomiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UmtomiTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.sabok.umtomi.tests
    dependencies:
      - target: Umtomi
