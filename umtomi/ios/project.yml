name: Umtomi
options:
  bundleIdPrefix: xyz.sabok
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Umtomi
    MARKETING_VERSION: 5.4.8
    CURRENT_PROJECT_VERSION: 10
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
targets:
  Umtomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Umtomi
    configFiles:
      Debug: DriveSync.xcconfig
      Release: DriveSync.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Umtomi/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock Umtomi with Face ID.
        GIDClientID: $(UMTOMI_GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(UMTOMI_GOOGLE_IOS_URL_SCHEME)
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.sabok.umtomi.bookshelf-sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.sabok.umtomi
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - UmtomiTests
  UmtomiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UmtomiTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.sabok.umtomi.tests
    dependencies:
      - target: Umtomi
